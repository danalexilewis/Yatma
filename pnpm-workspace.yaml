packages:
  - apps/*
  - packages/*

allowBuilds:
  browser-tabs-lock: false
  core-js: false
  workerd: false

catalog:
  "@eddy-works/never-rest": 0.7.0
  neverthrow: 8.2.0
  effect: 4.0.1
  "@effect/atom-react": 4.0.1
  "@effect/sql-sqlite-do": 4.0.1
  "@effect/vitest": 4.0.1
  "@effect/platform-node": 4.0.1
  "@clerk/backend": 3.18.1
  "@clerk/expo": 4.6.8
  typescript: 5.9.2
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  "@types/node": 24.12.4
  "@legendapp/list": 3.3.5
  expo-audio: 58.0.9

# Draggable FlatList 4.0.3 still imports InteractionManager, removed in RN 0.88.
# The patch defers its post-render drag reset with requestAnimationFrame instead.
patchedDependencies:
  react-native-draggable-flatlist@4.0.3: patches/react-native-draggable-flatlist@4.0.3.patch
